[project]
name = "drunkk-inference"
version = "0.1.0"
description = "Build theOG, a small Python code LLM, from scratch: tokenizer, data, model, training, evaluation, GGUF/Ollama export."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "tokenizers>=0.20",
    "numpy>=2.0",
    "pyarrow>=16",
    "huggingface_hub>=0.25",
]

[project.optional-dependencies]
export = ["gguf>=0.10"]
sanity = ["transformers>=4.40,<5"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["theog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
